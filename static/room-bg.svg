
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1800 1200"
     preserveAspectRatio="xMidYMid slice">

  <defs>
    <linearGradient id="wall" x2="0" y2="1">
      <stop stop-color="#a99b88"/>
      <stop offset="1" stop-color="#403c36"/>
    </linearGradient>

    <linearGradient id="window" x2="1" y2="1">
      <stop stop-color="#b6c3c2"/>
      <stop offset=".5" stop-color="#d0c7b5"/>
      <stop offset="1" stop-color="#87938a"/>
    </linearGradient>

    <linearGradient id="floor" x2="0" y2="1">
      <stop stop-color="#65594c"/>
      <stop offset="1" stop-color="#252724"/>
    </linearGradient>

    <filter id="blur">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
  </defs>

  <!-- Room walls -->
  <rect width="1800" height="1200" fill="url(#wall)"/>

  <!-- Large windows -->
  <g>
    <rect x="170" y="95" width="590" height="530"
          fill="#393b38"/>
    <rect x="185" y="110" width="560" height="500"
          fill="url(#window)"/>

    <path d="M465 110V610 M185 360H745"
          stroke="#625c52" stroke-width="17"/>

    <rect x="830" y="80" width="640" height="550"
          fill="#3d3b36"/>
    <rect x="845" y="95" width="610" height="520"
          fill="url(#window)"/>

    <path d="M1148 95V615 M845 355H1455"
          stroke="#655e52" stroke-width="18"/>
  </g>

  <!-- Soft outdoor scenery -->
  <g filter="url(#blur)" fill="#596c5c" opacity=".55">
    <ellipse cx="290" cy="430" rx="115" ry="170"/>
    <ellipse cx="670" cy="470" rx="120" ry="145"/>
    <ellipse cx="1030" cy="430" rx="150" ry="190"/>
    <ellipse cx="1390" cy="445" rx="130" ry="180"/>
  </g>

  <!-- Floor -->
  <rect y="720" width="1800" height="480"
        fill="url(#floor)"/>

  <!-- Sofa -->
  <g filter="url(#blur)">
    <path d="M90 800Q110 720 220 720H980
             Q1080 730 1100 830L1060 1010
             H120Q55 970 90 800Z"
          fill="#9c8771"/>

    <path d="M145 810H1005L1035 965H135Z"
          fill="#b29a80"/>
  </g>

  <!-- Desk -->
  <g>
    <rect x="1120" y="760" width="520" height="22"
          rx="11" fill="#4b4035"/>

    <rect x="1150" y="780" width="22" height="250"
          fill="#40372f"/>

    <rect x="1580" y="780" width="22" height="250"
          fill="#40372f"/>
  </g>

  <!-- Decorative indoor plant -->
  <g transform="translate(1580 540)" filter="url(#blur)">
    <path d="M0 300Q-12 170 -70 30
             M0 300Q45 150 100 10
             M0 300Q10 120 0 -20
             M0 300Q-80 190 -130 100"
          fill="none" stroke="#4b5d45" stroke-width="13"/>

    <g fill="#687b58">
      <ellipse cx="-75" cy="50" rx="25" ry="80"
               transform="rotate(-35 -75 50)"/>

      <ellipse cx="98" cy="30" rx="28" ry="86"
               transform="rotate(35 98 30)"/>

      <ellipse cx="0" cy="-5" rx="25" ry="90"/>

      <ellipse cx="-130" cy="105" rx="26" ry="82"
               transform="rotate(-55 -130 105)"/>

      <ellipse cx="62" cy="150" rx="25" ry="78"
               transform="rotate(48 62 150)"/>
    </g>

    <path d="M-70 280H70L52 390H-52Z"
          fill="#756353"/>
  </g>

  <!-- Warm sunlight -->
  <ellipse cx="900" cy="320" rx="720" ry="300"
           fill="#f3d9b4" opacity=".13"
           filter="url(#blur)"/>

  <!-- Atmospheric darkening -->
  <rect width="1800" height="1200"
        fill="#191a18" opacity=".18"/>

</svg>
